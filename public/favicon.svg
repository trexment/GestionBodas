<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#neonGrad)" stroke-width="8" opacity="0.8" />

  <!-- Inner Ambient Glow Circle -->
  <circle cx="256" cy="260" r="140" fill="url(#neonGrad)" opacity="0.15" filter="url(#glow)"/>

  <!-- Headphones Arc -->
  <path d="M 120 270 A 136 136 0 0 1 392 270" fill="none" stroke="url(#neonGrad)" stroke-width="32" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 120 270 A 136 136 0 0 1 392 270" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.8"/>

  <!-- Headphone Cushion Tops -->
  <rect x="100" y="240" width="36" height="40" rx="10" fill="#334155"/>
  <rect x="376" y="240" width="36" height="40" rx="10" fill="#334155"/>

  <!-- Earcups -->
  <rect x="90" y="260" width="56" height="110" rx="28" fill="url(#neonGrad)" filter="url(#glow)"/>
  <rect x="94" y="264" width="48" height="102" rx="24" fill="#0f172a"/>
  <rect x="102" y="278" width="32" height="74" rx="16" fill="url(#neonGrad)"/>

  <rect x="366" y="260" width="56" height="110" rx="28" fill="url(#neonGrad)" filter="url(#glow)"/>
  <rect x="370" y="264" width="48" height="102" rx="24" fill="#0f172a"/>
  <rect x="378" y="278" width="32" height="74" rx="16" fill="url(#neonGrad)"/>

  <!-- Equalizer / Waveform in Center -->
  <rect x="180" y="280" width="14" height="60" rx="7" fill="url(#goldGrad)" />
  <rect x="206" y="240" width="14" height="110" rx="7" fill="url(#neonGrad)" />
  <rect x="232" y="210" width="14" height="150" rx="7" fill="#38bdf8" />
  <rect x="256" y="190" width="14" height="180" rx="7" fill="#ffffff" filter="url(#glow)" />
  <rect x="280" y="220" width="14" height="135" rx="7" fill="#38bdf8" />
  <rect x="304" y="250" width="14" height="95" rx="7" fill="url(#neonGrad)" />
  <rect x="328" y="290" width="14" height="45" rx="7" fill="url(#goldGrad)" />

  <!-- Sparkle / Star top right -->
  <path d="M 400 110 Q 400 130 420 130 Q 400 130 400 150 Q 400 130 380 130 Q 400 130 400 110 Z" fill="#fbbf24" filter="url(#glow)"/>
</svg>
